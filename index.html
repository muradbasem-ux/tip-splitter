<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tip &amp; Bill Splitter Calculator</title>
<meta name="description" content="Calculate the tip and split the bill between any number of people. Free and instant.">
<link rel="stylesheet" href="style.css"><style>body{max-width:500px;margin:2rem auto;padding:0 1rem}label{display:block;margin:.8rem 0 .2rem}input{font:inherit;padding:.6rem;width:100%;box-sizing:border-box}#r{margin-top:1.2rem;font-size:1.2rem;background:var(--card);padding:1rem;border-radius:8px}.pre{display:flex;gap:.5rem;margin:.5rem 0}input[type=checkbox]{width:auto}.ad{margin:2rem 0;min-height:90px}</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1179483688927432" crossorigin="anonymous"></script>
</head><body><nav class="top"><a href="/">&larr; All free tools</a><span>Tip and Bill Splitter</span></nav><h1>Tip &amp; Bill Splitter</h1>
<label>Bill amount<input id="b" type="number" min="0" step="0.01" value="50"></label>
<label>Tip % <input id="t" type="number" min="0" value="15"></label>
<div class="pre"><button type="button" data-t="10">10%</button><button type="button" data-t="15">15%</button><button type="button" data-t="18">18%</button><button type="button" data-t="20">20%</button></div>
<label>People<input id="p" type="number" min="1" value="2"></label>
<label><input id="c" type="checkbox"> Round each share up to a whole number</label>
<div id="r"></div><div class="ad"><!-- AD SLOT --></div>
<script>
const $=i=>document.getElementById(i),f=n=>n.toFixed(2);
function u(){const b=Math.max(0,+$('b').value),p=Math.max(1,+$('p').value|0);let tp=b*Math.max(0,$('t').value)/100,s=(b+tp)/p;
if($('c').checked){s=Math.ceil(s);tp=s*p-b}
$('r').innerHTML=`Tip: <b>${f(tp)}</b> (${f(b?tp/b*100:0)}%)<br>Total: <b>${f(b+tp)}</b><br>Per person: <b>${f(s)}</b>`}
document.querySelectorAll('input').forEach(i=>i.oninput=u);
document.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{$('t').value=x.dataset.t;u()});u();
</script><section class="related"><h2>More tools</h2><a href="/loan-calculator/">Loan Payment Calculator</a><a href="/compound-interest-calculator/">Compound Interest Calculator</a><a href="/discount-calculator/">Discount Calculator</a><a href="/">Browse all</a></section><footer>Free tool · no sign-up · your data stays in your browser · <a href="/about.html">About</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></footer></body></html>
